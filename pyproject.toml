[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-drift-checker"
version = "1.0.0"
description = "Compare expected (Hibernate/DDL) schemas against live Oracle/PostgreSQL databases and report drift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sallehuddin Mohd Zakinuddin" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
schema-drift = "schemadrift.cli:main"

[tool.setuptools]
packages = ["schemadrift"]
